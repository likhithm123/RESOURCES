<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPSC Portal - Admin CMS</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="bar"><div class="logo">Admin CMS<small>Library, files (ImageKit) and learners</small></div><a class="btn" href="/">Back to tracker</a><button class="btn" id="out" hidden>Sign out</button></div></header>
<main>
  <section id="login" class="card">
    <form class="stack" id="loginForm"><label>Admin password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary">Sign in</button><div class="msg" id="loginMsg"></div></form>
  </section>
  <section id="cms" hidden>
    <div class="grid stats" id="stats"></div>
    <h2>Notice and registration</h2>
    <div class="card"><form class="stack" id="noticeForm" style="max-width:none"><textarea name="notice" rows="2" maxlength="600" placeholder="e.g. Prelims 2027 notification is out - revise Polity this week"></textarea><label>New account registration<select name="signup"><option value="open">open - anyone can create an account</option><option value="closed">closed - only existing accounts can sign in</option></select></label><div><button class="btn primary">Save</button> <span class="msg" id="noticeMsg"></span></div></form></div>
    <h2 id="formTitle">Add a resource</h2>
    <div class="card">
      <form class="stack" id="resForm">
        <input type="hidden" name="id">
        <label>Title<input name="title" required maxlength="200"></label>
        <label>Category<select name="category"><option value="general">general</option><option value="notebook">notebook (handwritten PDF)</option><option value="pyq">pyq</option><option value="current-affairs">current-affairs</option><option value="maps">maps</option><option value="finance">finance</option><option value="test">test</option></select></label>
        <label>Notebook key (only for category "notebook", e.g. 07-polity-constitution)<input name="slug" maxlength="80"></label>
        <label>Type<select name="kind"><option>pdf</option><option>link</option><option>video</option><option>image</option><option>note</option></select></label>
        <label>Upload a file to ImageKit (or paste a URL below)<input type="file" name="file"></label>
        <label>URL<input name="url" placeholder="https://..."></label>
        <label>Description<textarea name="description" rows="2" maxlength="1000"></textarea></label>
        <label>Sort order (small first)<input name="sort" type="number" value="100"></label>
        <div><button class="btn primary">Save resource</button> <button class="btn" type="button" id="cancel" hidden>Cancel edit</button></div>
        <div class="msg" id="resMsg"></div>
      </form>
    </div>
    <h2>Library</h2>
    <div class="card scroll"><table id="resTable"></table></div>
    <h2>Learners</h2>
    <div class="card scroll"><table id="learners"></table></div>
  </section>
</main>
<script src="/admin.js" type="module"></script>
</body>
</html>
