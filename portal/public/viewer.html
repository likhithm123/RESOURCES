<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notebook viewer</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #pages { display: grid; gap: 14px; justify-items: center; padding: 16px 8px 60px; }
  .pg { position: relative; width: min(100%, 860px); background: #f7f6fb; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .pg canvas { display: block; width: 100%; height: auto; pointer-events: none; }
  .pg::after { content: attr(data-wm); position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: rgba(27,63,174,.09); transform: rotate(-28deg); pointer-events: none; white-space: nowrap; }
  #state { text-align: center; padding: 40px 16px; color: var(--mute); }
  @media print { body * { display: none !important; } body::before { content: 'Printing is disabled for this notebook.'; } }
</style>
</head>
<body>
<header class="top"><div class="bar"><div class="logo" id="title">Notebook<small id="sub">View only</small></div><a class="btn" href="/">Back to tracker</a></div></header>
<div id="state">Opening notebook...</div>
<div id="pages"></div>
<script type="module" src="/viewer.js"></script>
</body>
</html>
